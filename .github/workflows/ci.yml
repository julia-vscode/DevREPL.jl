name: CI

# TEMP: while DevREPL uses regular Pkg deps, its [sources] section points at
# sibling dev checkouts of JuliaWorkspaces and TestItemControllers, so this
# workflow checks those repos out next to DevREPL. Switch back to the shared
# julia-testitems/testitem-workflow CI when the vendored subtrees return.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
        with:
          path: DevREPL
      - uses: actions/checkout@v5
        with:
          repository: julia-vscode/JuliaWorkspaces.jl
          path: JuliaWorkspaces
      - uses: actions/checkout@v5
        with:
          repository: julia-vscode/TestItemControllers.jl
          path: TestItemControllers
      - uses: julia-actions/setup-julia@v2
        with:
          version: '1'
      - uses: julia-actions/cache@v2
      - name: Run tests
        run: julia --project=DevREPL -e 'import Pkg; Pkg.resolve(); Pkg.test()'
